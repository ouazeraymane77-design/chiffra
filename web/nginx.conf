server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # L'interface est une application d'une seule page : toute route inconnue
    # retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les appels a l'API et l'ouverture des pieces justificatives partent vers
    # le service Python. Le controle complet peut prendre une minute.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
